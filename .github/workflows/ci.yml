name: CI

on:
  push:
    branches: [main, cartesian-formulation, 'wp*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and regression tests (Julia ${{ matrix.julia }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12']
    env:
      FLOODA5_NO_VIS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/python-requirements.txt
      - run: pip install -r ci/python-requirements.txt

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2

      - name: Instantiate CI environment and point PyCall at this Python
        run: |
          julia --project=ci -e '
            using Pkg
            ENV["PYTHON"] = Sys.which("python")
            Pkg.instantiate()
            Pkg.build("PyCall")
            Pkg.precompile()'
          julia --project=ci -e 'using PyCall; println("PyCall python: ", PyCall.python); pyimport("a5"); println("pya5 OK")'

      - name: Run test set
        run: bash ci/run_tests.sh ci

      - name: Thread-count determinism (1 vs 4 threads)
        run: |
          julia --project=ci -t 1 test/check_determinism.jl | grep '^FINGERPRINT' > det_t1.txt
          julia --project=ci -t 4 test/check_determinism.jl | grep '^FINGERPRINT' > det_t4.txt
          cat det_t1.txt
          diff det_t1.txt det_t4.txt && echo "Deterministic across thread counts."
